plugins {
    id 'java'               // Java plugin
    id 'application'        // Application plugin (to run your main class)
}

group = 'com.example'       // Your project group
version = '1.0-SNAPSHOT'    // Your project version

// Specify the Java version
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11) // change to 21 if needed
    }
}

// Repositories to fetch dependencies from
repositories {
    mavenCentral()
}

// Dependencies (modern Gradle 8+ syntax)
dependencies {
    implementation 'com.google.guava:guava:23.0'         // runtime + compile
    testImplementation 'junit:junit:4.13.2'             // testing
}

// Specify your main class for application plugin
application {
    mainClass = 'com.example.App'   // Replace with your actual main class package
}

// Optional: enable warnings for deprecated Gradle features
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}
